<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FAE Study</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <!-- Load jsPsych and required plugins (from your existing MRT repo) -->
  <script src="js/external/jspsych.js"></script>
  <script src="js/external/plugin-preload.js"></script>
  <script src="js/external/plugin-html-keyboard-response.js"></script>
  <script src="https://unpkg.com/@jspsych/plugin-image-keyboard-response@1.1.3"></script>

  <script src="https://unpkg.com/@jspsych/plugin-instructions@1.1.4"></script>
  <script src="https://unpkg.com/@jspsych-contrib/plugin-pipe@0.3"></script>

  <script src="js/external/plugin-html-multi-keyboard-response.js"></script>
  <script src="js/external/plugin-audio-multi-keyboard-response.js"></script>
  <script src="js/external/plugin-html-button-response-custom.js"></script>
  <script src="js/external/plugin-survey-likert.js"></script>
  <script src="js/external/plugin-survey-html-form.js"></script>

  <script src="js/scales.js"></script>

  <link rel="stylesheet" href="css/jspsych.css">

  <style>
    body { background: black; position: relative; }
    .fixation { color: white; font-size: 64px; text-align:center; }
    .center { color: white; text-align: center; }
    .mrt-probe-screen, .emotion-response-screen {
      width: min(1050px, calc(100vw - 40px));
      box-sizing: border-box;
      margin: 0 auto;
      color: white;
      font-size: 24px;
      line-height: 1.45;
      letter-spacing: 0;
    }
    .mrt-probe-screen { min-height: 360px; text-align: left; }
    .mrt-probe-question { margin: 0 0 50px; font: inherit; font-weight: 400; text-align: left; }
    /* Keep the original scale's inherited text metrics separate from the question. */
    .mrt-focus-screen > div { font-size: 18px; line-height: 28.8px; }
    .mrt-certainty-options {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin: 36px 0 24px;
    }
    .mrt-certainty-option {
      box-sizing: border-box;
      width: 100%;
      height: 104px;
      padding: 8px;
      border: 2px solid #ddd;
      border-radius: 4px;
      background: #242424;
      color: #fff;
      font: inherit;
      font-size: 22px;
      line-height: 1.3;
      letter-spacing: 0;
      cursor: pointer;
    }
    .mrt-certainty-option[aria-disabled="true"] {
      border-color: #555;
      background: #121212;
      color: #999;
      cursor: not-allowed;
    }
    .mrt-certainty-option[aria-disabled="false"]:hover { background: #444; }
    .mrt-certainty-hint, .mrt-basis-hint { font-size: 18px; text-align: center; }
    .emotion-confidence-screen { min-height: 360px; text-align: left; }
    .emotion-confidence-screen > p:first-child { margin: 0 0 50px; font: inherit; font-weight: 400; text-align: left; }
    .emotion-confidence-screen > p:last-child { font-size: 18px; text-align: center; }
    .confidence-option-number, .confidence-option-label { display: block; }
    .confidence-option-number { margin-bottom: 4px; }
    .mrt-basis-options {
      list-style: none;
      padding: 0;
      text-align: left;
    }
    .mrt-basis-options li { margin: 20px 0; }
    .emotion-response-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin: 28px 0; }
    .emotion-response-options.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .study-response-button { min-height: 64px; padding: 12px 20px; font: inherit; color: white; background: #242424; border: 2px solid #ddd; border-radius: 4px; cursor: pointer; }
    .study-response-button:hover { background: #444; }
    .study-response-button:disabled { color: #999; border-color: #555; cursor: not-allowed; background: #121212; }
    .emotion-response-options.four { gap: 12px; margin: 36px 0 24px; }
    .emotion-response-options.four .study-response-button {
      box-sizing: border-box;
      width: 100%;
      min-height: 104px;
      padding: 8px;
      font-size: 22px;
      line-height: 1.3;
      letter-spacing: 0;
    }
    .jspsych-content.emotion-replay-trial {
      box-sizing: border-box;
      width: 100%;
      max-width: 100%;
      height: 100vh;
      height: 100dvh;
      padding-bottom: 80px;
    }
    .emotion-replay-trial #jspsych-html-keyboard-response-stimulus {
      box-sizing: border-box;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 24px 0;
    }
    .emotion-replay-trial .emotion-response-screen { margin: auto; }
    .replay-button {
      position: fixed;
      right: max(16px, env(safe-area-inset-right));
      bottom: max(16px, env(safe-area-inset-bottom));
      box-sizing: border-box;
      min-height: 40px;
      max-width: calc(100vw - 32px);
      padding: 8px 12px;
      font-size: 14px;
      line-height: 1.4;
      color: #aaa;
      border: 1px solid #555;
      background: #111;
    }
    .replay-button:hover:not(:disabled) { color: #fff; background: #242424; }
    .replay-button:disabled { color: #777; border-color: #333; background: #080808; }
    .emotion-instructions, .mrt-instructions, .mrt-sound-check-screen {
      box-sizing: border-box;
      width: min(860px, calc(100vw - 40px));
      margin: 24px auto;
      color: white;
      font-size: 22px;
      line-height: 1.5;
      letter-spacing: 0;
      text-align: left;
    }
    .emotion-instructions h2, .mrt-instructions h2, .mrt-sound-check-screen h2 { margin: 0 0 24px; font-size: 26px; line-height: 1.3; }
    .emotion-instructions h3 { margin: 24px 0 8px; font-size: 22px; line-height: 1.4; }
    .emotion-instructions p, .mrt-instructions p, .mrt-sound-check-screen p { margin: 0 0 16px; }
    .mrt-sound-check-button {
      min-height: 56px;
      padding: 12px 20px;
      font: inherit;
      color: white;
      background: #242424;
      border: 2px solid #ddd;
      border-radius: 4px;
      cursor: pointer;
    }
    .mrt-sound-check-button:hover { background: #444; }
    .mrt-sound-check-button:focus-visible { outline: 3px solid white; outline-offset: 4px; }
    .mrt-sound-check-screen .mrt-sound-check-status { min-height: 3em; margin: 16px 0; font-size: 18px; }
    .mrt-sound-check-screen .mrt-sound-check-continue { margin: 28px 0 0; text-align: center; }
    .mrt-instructions ul { margin: 0 0 16px; padding-left: 28px; }
    .mrt-instructions li { margin: 0 0 16px; }
    .emotion-instructions .emotion-instructions-continue { margin: 28px 0 0; text-align: center; }
    .emotion-instructions .emotion-instructions-lock-status { min-height: 1.5em; margin: 28px 0 0; font-size: 18px; text-align: center; }
    .emotion-final-instructions { font-size: 24px; }
    .emotion-final-instructions h2 { font-size: 32px; }
    .emotion-final-instructions u { text-underline-offset: 3px; }
    .speed-reminder { max-width: 850px; margin: 24px auto; font-size: 22px; line-height: 1.5; }
    @media (max-width: 600px) {
      .mrt-probe-screen, .emotion-response-screen {
        width: calc(100vw - 24px);
        font-size: 18px;
      }
      .mrt-certainty-options, .emotion-response-options.four { gap: 4px; }
      .mrt-certainty-option, .emotion-response-options.four .study-response-button { font-size: 14px; padding: 2px; }
      .emotion-instructions, .mrt-instructions, .mrt-sound-check-screen { width: calc(100vw - 32px); font-size: 18px; }
      .emotion-instructions h2, .mrt-instructions h2, .mrt-sound-check-screen h2 { font-size: 24px; }
      .emotion-instructions h3 { font-size: 20px; }
      .emotion-final-instructions { font-size: 20px; }
      .emotion-final-instructions h2 { font-size: 26px; }
    }
    @media (max-width: 360px) {
      .mrt-certainty-option, .emotion-response-options.four .study-response-button { font-size: 13px; }
    }
    .plus { font-family: "Montserrat", sans-serif; font-size: 150px; font-weight: bold; position: absolute; transform: translate(-50%, -50%); color: #bbb;  left: 50%; top: 50%; }


    /* Make jsPsych content readable on black background */
    .jspsych-display-element,
    .jspsych-content,
    .jspsych-content-wrapper,
    .jspsych-instructions-nav,
    .jspsych-instructions-nav a {
      color: white !important;
    }

    /* Instruction navigation uses light buttons, so their labels must be dark. */
    .jspsych-instructions-nav .jspsych-btn {
      color: #111 !important;
    }

    .jspsych-instructions-nav .jspsych-btn:disabled {
      color: #666 !important;
      cursor: not-allowed;
      opacity: 0.6;
    }

    #mrt-instruction-lock-status {
      color: white;
      min-height: 1.5em;
      margin: 1.25rem 0 0.5rem;
      text-align: center;
    }

    .jspsych-content p,
    .jspsych-content li,
    .jspsych-content em,
    .jspsych-content strong,
    .jspsych-instructions p {
      color: white !important;
    }

</style>
</head>
<body></body>

<script type="module" src="main.js?v=20261014-tap-feedback"></script>
</html>
